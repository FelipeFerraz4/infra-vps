# ==========================================
# HTTP → REDIRECT + CERTBOT
# ==========================================
server {
    listen 80;
    listen [::]:80;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;

    server_name bluefoxaquarismo.space www.bluefoxaquarismo.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# HTTPS
# ==========================================
upstream aquarismo_frontend {
    server aquarismo-frontend:4000;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # HTTP/2 separado
    http2;

    # HTTP/3 (QUIC)
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name bluefoxaquarismo.space www.bluefoxaquarismo.space;

    ssl_certificate     /etc/letsencrypt/live/bluefoxaquarismo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bluefoxaquarismo.space/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP/3 Alt-Svc
    add_header Alt-Svc 'h3=":443"'; 

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;

    # ==========================================
    # CERTBOT
    # ==========================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ==========================================
    # CACHE DE ESTÁTICOS
    # ==========================================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ==========================================
    # PROXY PASS PARA FRONT-END
    # ==========================================
    location / {
        proxy_pass http://aquarismo_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tempos curtos para não travar o nginx
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        # Fallback em caso de erro
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        return 302 https://felipeferraz.site;
        # ou:
        # return 302 /manutencao;
    }
}
