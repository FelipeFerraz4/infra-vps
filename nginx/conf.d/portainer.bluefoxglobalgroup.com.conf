# ==========================================
# HTTP → REDIRECT + CERTBOT
# ==========================================
server {
    listen 80;
    listen [::]:80;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;

    server_name portainer.bluefoxglobalgroup.com www.portainer.bluefoxglobalgroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Portas padrão SSL (TCP)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Portas HTTP/3 QUIC (UDP)
    listen 443 quic;
    listen [::]:443 quic;

    # Ativação do HTTP/2 (Nova sintaxe)
    http2 on;

    server_name portainer.bluefoxglobalgroup.com www.portainer.bluefoxglobalgroup.com;

    ssl_certificate /etc/letsencrypt/live/portainer.bluefoxglobalgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.bluefoxglobalgroup.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP/3 Alt-Svc
    add_header Alt-Svc 'h3=":443"'; 

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;

    # ==========================================
    # CERTBOT
    # ==========================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ==========================================
    # PROXY PASS PARA PORTAINER (Interface)
    # ==========================================
    location / {
        proxy_pass http://infra-portainer:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # WEBSOCKETS (Exclusivo para Logs e Console)
    # ==========================================
    location /api/websocket/ {
        proxy_pass http://infra-portainer:9000/api/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
