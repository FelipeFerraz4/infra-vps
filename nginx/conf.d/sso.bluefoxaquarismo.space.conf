# ==========================================
# HTTP → REDIRECT + CERTBOT
# ==========================================
server {
    listen 80;
    listen [::]:80;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;

    server_name sso.bluefoxaquarismo.space www.sso.bluefoxaquarismo.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# SSO - KEYCLOAK
# ==========================================
upstream keycloak {
    server bluefox-iam-server:8080;
}


server {
    # Portas padrão SSL (TCP)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Portas HTTP/3 QUIC (UDP)
    listen 443 quic;
    listen [::]:443 quic;

    # Ativação do HTTP/2 (Nova sintaxe)
    http2 on;

    server_name sso.bluefoxaquarismo.space www.sso.bluefoxaquarismo.space;

    ssl_certificate     /etc/letsencrypt/live/sso.bluefoxaquarismo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.bluefoxaquarismo.space/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP/3 Alt-Svc
    add_header Alt-Svc 'h3=":443"';

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;

    # ==========================================
    # CERTBOT
    # ==========================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ==========================================
    # PROXY PASS PARA FRONT-END
    # ==========================================
    location / {
        proxy_pass http://keycloak;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # O Keycloak pode demorar um pouco mais em certas operações de admin
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Fallback em caso de erro
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        return 302 https://felipeferraz.site;
        # ou:
        # return 302 /manutencao;
    }
}
