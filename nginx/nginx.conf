# ===============================
# LOAD MODULES
# ===============================
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ===============================
    # PERFORMANCE BASE
    # ===============================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # ===============================
    # GZIP
    # ===============================
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ===============================
    # BROTLI
    # ===============================
    brotli on;
    brotli_comp_level 5;
    brotli_static on;

    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ===============================
    # SECURITY
    # ===============================
    server_tokens off;

    # ===============================
    # LOGS (padrão)
    # ===============================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ===============================
    # INCLUDE SERVERS
    # ===============================
    include /etc/nginx/conf.d/*.conf;
}
